services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: timescale

    environment:
      POSTGRES_DB: iot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-create-app-role.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
